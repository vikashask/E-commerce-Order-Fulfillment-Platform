name: fulfillment-service-test
services:
  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: fulfillment_test
    ports:
      - "5500832:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d fulfillment_test"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
